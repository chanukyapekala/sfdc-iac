name: Deploy to Staging

on:
  push:
    branches:
      - staging

# Prevent concurrent deploys to staging
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → Staging Org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install CumulusCI and Salesforce CLI
        uses: cumulus-actions/setup-cumulus@main

      - name: Authenticate to Staging Org (JWT)
        run: |
          echo "${{ secrets.STAGING_JWT_KEY }}" > server.key
          sf org login jwt \
            --client-id "${{ secrets.STAGING_CLIENT_ID }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.STAGING_USERNAME }}" \
            --instance-url "${{ secrets.STAGING_INSTANCE_URL }}" \
            --alias staging
          rm server.key
        env:
          STAGING_JWT_KEY: ${{ secrets.STAGING_JWT_KEY }}

      - name: Connect org to CumulusCI
        run: cci org import staging staging

      - name: Run deploy_staging flow
        run: cci flow run deploy_staging --org staging
