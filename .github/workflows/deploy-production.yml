name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → Production Org
    runs-on: ubuntu-latest
    environment: production
    container:
      image: ghcr.io/${{ github.repository_owner }}/sf-cli:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Production Org (JWT)
        run: |
          echo "${{ secrets.PROD_JWT_KEY }}" > /tmp/server.key
          sf org login jwt \
            --client-id "${{ secrets.PROD_CLIENT_ID }}" \
            --jwt-key-file /tmp/server.key \
            --username "${{ secrets.PROD_USERNAME }}" \
            --instance-url "${{ secrets.PROD_INSTANCE_URL }}" \
            --alias production
          rm /tmp/server.key

      - name: Validate Deployment (check-only)
        run: sf project deploy start --target-org production --dry-run --test-level RunLocalTests

      - name: Deploy to Production Org
        run: sf project deploy start --target-org production --test-level RunLocalTests
